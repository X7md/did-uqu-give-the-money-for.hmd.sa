# إعادة بناء يومية عند منتصف الليل بتوقيت السعودية (UTC+3) لتحديث عدادات الأيام
# في الـ HTML الساكن (العدادات تتحدث لدى الزائر عبر الترطيب، لكن النسخة المبنية
# مسبقًا — أول رسم ومحركات البحث — تتجمد عند وقت البناء لولا هذا الجدول).
name: daily-rebuild

on:
  schedule:
    - cron: '0 21 * * *' # 21:00 UTC = 00:00 بتوقيت السعودية
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
